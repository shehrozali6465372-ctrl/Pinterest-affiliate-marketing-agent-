name: Pinterest Learning Loop

on:
  schedule:
    # Daily at 03:17 UTC (08:17 Pakistan Standard Time).
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinterest-learning-loop
  cancel-in-progress: false

jobs:
  ingest-analytics:
    name: Ingest real Pinterest analytics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AGENT_BASE_URL: https://pinterest-affiliate-marketing-agent.onrender.com
      APP_API_KEY: ${{ secrets.PINTEREST_AGENT_APP_API_KEY }}
      PINTEREST_ACCOUNT_ID: ${{ vars.PINTEREST_ACCOUNT_ID || 'pinterest:1069323642682526567' }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$APP_API_KEY" ]]; then
            echo "::error::Configure the GitHub Actions secret PINTEREST_AGENT_APP_API_KEY before running this workflow."
            exit 1
          fi
          if [[ ! "$PINTEREST_ACCOUNT_ID" =~ ^pinterest:[A-Za-z0-9_-]+$ ]]; then
            echo "::error::PINTEREST_ACCOUNT_ID must be a Pinterest account identifier."
            exit 1
          fi

      - name: Check out workflow summary helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Call the protected Learning Loop endpoint
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 100 \
            --request POST "$AGENT_BASE_URL/learning-loop/run" \
            --header "X-API-Key: $APP_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"account_id":"'"$PINTEREST_ACCOUNT_ID"'","period_days":30}')"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Learning Loop endpoint returned HTTP $status."
            # Print only safe API error metadata; never echo request headers or secrets.
            python - "$response_file" <<'PY'
          import json, sys
          try:
              with open(sys.argv[1], encoding="utf-8") as stream:
                  body = json.load(stream)
              detail = body.get("detail", body.get("error", "No error detail returned")) if isinstance(body, dict) else "Unexpected error response"
              if isinstance(detail, dict):
                  detail = {"stage": detail.get("stage"), "error": detail.get("error"), "upstream_http_status": detail.get("upstream_http_status")}
              print(json.dumps({"error": detail}, separators=(",", ":")))
          except Exception:
              print('{"error":"Non-JSON error response"}')
          PY
            exit 1
          fi
          python scripts/workflow_summary.py learning "$response_file"
