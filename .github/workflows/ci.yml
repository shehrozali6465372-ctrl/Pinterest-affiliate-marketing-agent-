name: Python CI

on:
  push:
    branches:
      - main
      - fix/pb06-analytics-forward-port
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: model2_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d model2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt bandit "pip-audit==2.10.1"
      - name: Run static security scan
        run: bandit -r app -ll -q
      - name: Audit dependency vulnerabilities
        run: pip-audit -r requirements.txt -r requirements-dev.txt --strict --timeout 15 --progress-spinner off
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/model2_test
        run: python -m pytest -q
